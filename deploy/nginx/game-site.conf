# The routes of the game, the same on every address of it (since 2026-10-13): world.kandrax.app
# (the main address) and game.azyr.io (its mirror). Static files; /api/ and /auth/ (accounts and
# characters) and /ws (the multiplayer server) go to the game server (PM2: game-server on
# 127.0.0.1:3008).
#
# Install as /etc/nginx/snippets/game-site.conf. Each site includes it inside its server block for
# port 443, after its own certificate, mTLS snippet and logs. Change the routes here, once.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

root /var/www/game.azyr.io;
index index.html;

client_max_body_size 64k;

# A location that sets add_header does NOT inherit the add_header lines of the server
# block. Thus each location below repeats the security headers. Do not remove them.

# The multiplayer server. proxy_read_timeout has to outlast a quiet connection: the server
# pings every 25 s, which also keeps Cloudflare from dropping the connection at ~100 s.
location = /ws {
	proxy_pass http://127.0.0.1:3008;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_set_header Host $host;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;

	# SET, not $proxy_add_x_forwarded_for. The server limits connections per address with
	# it, and appending would let a client add a value of its own to get a fresh limit.
	proxy_set_header X-Forwarded-For $remote_addr;

	# A websocket must never be cached, whatever a Cloudflare rule might say.
	proxy_cache_bypass 1;
}

# Accounts and characters (since 2026-10-09): the JSON API and the sign-in with Google. The
# server sets Cache-Control: no-store on every answer. The security headers of the server
# block apply here, because this location sets none of its own.
# Host is the address of the visitor: a sign-in that starts on the mirror comes back to it.
location ~ ^/(api|auth)/ {
	proxy_pass http://127.0.0.1:3008;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	# SET, as for /ws.
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 30s;
	proxy_cache_bypass 1;
}

# Vite gives every file in /assets/ a content hash in its name, so a year and immutable is
# correct here. A new build makes new names.
location /assets/ {
	try_files $uri =404;
	add_header Cache-Control "public, max-age=31536000, immutable" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# The entry page must never be cached: it names the current hashed bundle. try_files serves
# "/" from inside this location, so the no-store must be here.
location / {
	try_files $uri $uri/ /index.html;
	add_header Cache-Control "no-store" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer-when-downgrade" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
