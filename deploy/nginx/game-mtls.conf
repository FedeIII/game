# Cloudflare Authenticated Origin Pulls for game.azyr.io.
#
# Install as /etc/nginx/snippets/game-mtls.conf. The site includes it by glob
# (game-mtls*.conf): without the file, nothing changes; move it aside and reload to roll back.
#
# With this on, a local curl gets 400 "No required SSL certificate was sent". That is
# correct, not a fault. Test the files on disk, or the public URL through Cloudflare.
# Authenticated Origin Pulls is already on for the azyr.io zone (hidden-agenda uses it).

ssl_client_certificate /etc/nginx/ssl/cloudflare-origin-pull-ca.pem;
ssl_verify_client on;
