# Cloudflare Authenticated Origin Pulls for world.kandrax.app (the kandrax.app zone).
#
# Install as /etc/nginx/snippets/kandrax-mtls.conf. The site includes it by glob
# (kandrax-mtls*.conf): without the file, nothing changes; move it aside and reload to roll back.
#
# Install it ONLY after Authenticated Origin Pulls is on for the kandrax.app zone AND seen on the
# wire (deploy/README.md, "world.kandrax.app"). If Cloudflare sends no client certificate,
# `ssl_verify_client on` fails every request of the site.
#
# With this on, a local curl gets 400 "No required SSL certificate was sent". That is
# correct, not a fault. Test the files on disk, or the public URL through Cloudflare.

ssl_client_certificate /etc/nginx/ssl/cloudflare-origin-pull-ca.pem;
ssl_verify_client on;
